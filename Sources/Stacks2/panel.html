    native({ cmd: "follow", after: last });
  } catch (err) {
    ready = false;
    window.__stacksReady = false;
    shell.innerHTML = `<div class="empty">${esc(err && err.message || err)}</div>`;
  }
}
boot();
</script>
</body>
</html>
