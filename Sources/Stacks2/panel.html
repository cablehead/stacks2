<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>Stacks</title>
<style>
  :root, [data-theme="dark"] {
    --text: #c5c6c7;
    --text-reverse: #d0d0d0;
    --bg: #232323;
    --highlight: #4f5c6c;
    --panel: #1f1f1fef;
    --selected: #4a4a4a;
    --button: #4a4a4a;
    --hover: #333333;
    --border: #3e3e3e;
    --shadow: rgba(102, 102, 102, 0.4);

    --broadcast-on: linear-gradient(45deg, #0057b8, #0057b8 30%, #ffd700 70%, #ffd700);
  }
  [data-theme="light"] {
    --text: #1d1f21;
    --text-reverse: #1a1c1e;
    --bg: #f5f5f5;
    --highlight: #c0d4ee;
    --panel: #ffffffef;
    --selected: #d1d1d1;
    --button: #d1d1d1;
    --hover: #e2e2e2;
    --border: #ccc;
    --shadow: rgba(0, 0, 0, 0.2);
    --broadcast: linear-gradient(45deg, #b0cff7, #b0cff7 30%, #fbf9d6 70%, #fbf9d6);
    --broadcast-on: linear-gradient(45deg, #00a5ff, #00a5ff 30%, #fff375 70%, #fff375);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: ui-monospace, monospace;
    letter-spacing: -0.02ch;
    line-height: 1.5;
    padding: 10px;
    box-sizing: border-box;
  }
  ::-webkit-scrollbar { display: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: transparent; border: 0; padding: 0; cursor: pointer; }
  input, textarea { background: transparent; border: 0; outline: none; width: 100%; }
  ::placeholder, ::-webkit-input-placeholder { color: inherit; opacity: 0.54; }
  #shell {
    color: var(--text);
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .top {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 0.5ch;
    height: 5ch;
    padding: 1ch 1ch 0.25ch 2ch;
    border-bottom: 1px solid var(--border);
    box-sizing: border-box;
    flex: none;

  .vdiv { width: 1px; height: 1.5em; background: var(--border); flex: none; }

  .top .hoverable, .top button { font-size: 0.9rem; }

    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 1ch;
    overflow: hidden;

  .cols { flex: 1; display: flex; min-height: 0; gap: 0.5ch; overflow: hidden; }
  .col {
    flex: 1;
    max-width: 14ch;
    overflow-y: auto;
    padding-right: 0.5rem;
    border-right: 1px solid var(--border);
    min-height: 0;
  }
  .col.wide { max-width: 20ch; }
  .previews {
    flex: 3;
    min-width: 0;
    overflow: auto;
    container-type: size;
    display: flex;
    flex-direction: column;
  }
  .terserow {
    display: flex;
    width: 100%;
    gap: 0.5ch;
    overflow: hidden;
    padding: 0.5ch 0.75ch;
    border-radius: 6px;
    cursor: pointer;
    box-sizing: border-box;
  }
  .terserow:hover, .terserow.hover { background: var(--hover); }
  .terserow.selected { background: var(--selected); }
  .terserow.highlight { background: var(--highlight); color: var(--text-reverse); }
  .terserow .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .terserow .icon { width: 2ch; flex: none; }
  .preview { padding: 0.25lh 0; }
  .preview.not-active { opacity: 0.3; filter: grayscale(30%); }
  .preview.not-active:hover { opacity: 0.6; filter: grayscale(60%); background: var(--bg); }
  .preview.active { box-shadow: 0 0 6px var(--shadow); background: var(--bg); }
  .preview .body { padding: 0 1ch; white-space: pre-wrap; }
  .preview img { max-width: 100%; max-height: 90cqh; width: auto; height: auto; display: block; }
  .markdown { padding: 0 2ch; }

  .markdown blockquote { margin: 0; padding-left: 2ch; border-left: 4px solid var(--border); }
  .markdown pre { white-space: pre-wrap; }
  a { color: var(--text); text-underline-offset: 3px; }
  .meta {
    position: absolute;
    width: 47ch;
    right: 0;
    bottom: 0;
    z-index: 10;
    font-size: 0.9rem;
    padding: 0.25lh 0 0.25lh 1ch;
    border-radius: 0.5em 0 0 0;
    background: var(--panel);
    box-shadow: 0 0 6px var(--shadow);
  }
  .meta-row { display: flex; width: 100%; }
  .meta-row .k { width: 16ch; flex: none; }
  .meta-row .v { overflow-wrap: anywhere; min-width: 0; }
  .meta-row .v.line { display: flex; gap: 1ch; align-items: baseline; padding-right: 1ch; }
  .meta-row .v.line .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .meta-row .v.line .dim, .meta-row .v.line svg { flex: none; }

    background: rgba(217, 180, 74, 0.35);
    border-radius: 3px;

    font-size: 0.9rem;
    gap: 0.5ch;

    background: var(--button);

    font-size: 0.9rem;
  }

    flex-direction: column;
    overflow: hidden;

    z-index: 1000;
    padding: 1ch;
    background: transparent;

    background: var(--panel);
    box-shadow: 0 0 6px var(--shadow);
    border-radius: 0.5rem;
    padding: 2ch;
    box-sizing: border-box;

  .markup-tools .swatch { display: block; width: 1.1em; height: 1.1em; border-radius: 50%; }

  .markup-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #markup-canvas { cursor: crosshair; outline: none; }
  #markup-text { position: absolute; padding: 0 0.3ch; background: transparent; border: 1px dashed currentColor; line-height: 1.2; resize: none; overflow: hidden; white-space: pre; }
  .icon-btn {
    width: 1.5em;
    height: 1.5em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    flex: none;
  }
  .icon-btn svg { width: 100%; height: 100%; vertical-align: middle; }
  .broadcast { border-radius: 4px; padding: 4px; }
  .broadcast.on { background-image: var(--broadcast-on); }

    width: 40ch;
    right: 4ch;
    bottom: 0;
    border-radius: 0.5rem 0.5rem 0 0;
    padding: 1ch 2ch;
    display: flex;
    flex-direction: column;
    gap: 1ch;
  }
  .mod {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.3ch 0.8ch;
  }
  .mod.on { background-image: var(--broadcast-on); }
  .empty { opacity: 0.7; padding: 0.5ch; }
  svg { width: 1em; height: 1em; vertical-align: -0.15em; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

shell.addEventListener("click", (event) => {

  const id = el.dataset.id;
  (async () => {
    try {
      if (act === "select-stack") selectStack(id);

let liveChain = Promise.resolve();
