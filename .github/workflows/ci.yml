name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xs-ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('xs-ffi/Cargo.lock') }}

      - name: Clippy on xs-ffi
        run: cargo clippy --release --manifest-path xs-ffi/Cargo.toml -- -D warnings

      - name: Build the app
        run: ./build
