[package]
name = "xs-ffi"
version = "0.1.0"
edition = "2021"
publish = false

# xs, built into Stacks2: a C interface over the cross-stream store, so
# Stacks2 calls the store in its own process instead of talking to an
# `xs serve` over its socket. The socket is still served, for the xs command.
[lib]
name = "xs_ffi"
crate-type = ["staticlib"]

[dependencies]
cross-stream = "=0.15.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
ssri = "9.2.0"

[profile.release]
debug = false
